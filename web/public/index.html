<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Tournament System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <!-- Top Bar for Actions -->
        <div class="top-bar card" style="display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 2rem; padding: 1rem 1.5rem;">
            <button id="theme-toggle-btn" class="btn" style="background: var(--text); color: var(--bg); font-size: 1rem;">🌓 Theme</button>
            <button id="reset-btn" class="btn btn-danger">Reset Tournament</button>
            <button id="clear-scores-btn" class="btn btn-warning">Clear Scores</button>
            <div class="report-dropdown" style="position: relative;">
                <button class="btn" onclick="toggleReportMenu(event)">Report Issue</button>
                <div id="report-menu" class="dropdown-content">
                    <textarea id="issue-text" placeholder="Type any issues you experience..." rows="4"></textarea>
                    <button type="button" class="btn btn-success" onclick="submitIssue()">Submit</button>
                </div>
            </div>
            
            <button class="btn btn-info" onclick="openLeaderboard()">TAT Leaderboard</button>

            <div class="account-dropdown" style="position: relative;">
                <button class="btn" id="account-btn" onclick="toggleAccountMenu(event)">Account 👤</button>
                <div id="account-menu" class="dropdown-content">
                    <div id="login-form-container">
                        <input type="text" id="auth-username" placeholder="Username" style="margin-bottom: 5px; width: 100%; box-sizing: border-box;">
                        <input type="password" id="auth-password" placeholder="Password" style="margin-bottom: 5px; width: 100%; box-sizing: border-box;">
                        <div style="display: flex; gap: 5px;">
                            <button class="btn btn-success" style="flex: 1;" onclick="handleLogin()">Log In</button>
                            <button class="btn btn-primary" style="flex: 1;" onclick="handleSignup()">Sign Up</button>
                        </div>
                    </div>
                    <div id="logged-in-container" style="display: none; text-align: center;">
                        <p style="margin-bottom: 5px;">Logged in as: <strong id="logged-in-username"></strong></p>
                        <p style="margin-bottom: 10px;">Elo: <strong id="logged-in-elo"></strong></p>
                        <button class="btn btn-danger" style="width: 100%;" onclick="handleLogout()">Log Out</button>
                    </div>
                </div>
            </div>
        </div>

        <header>
            <h1>♟️ Chess TAT 2 <span class="beta-badge">BETA</span></h1>
            <img src="assets/lion.png" class="logo" alt="Lion logo" />
            <div class="header-actions" style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
                <div id="tournament-status" class="status-badge">Not Started</div>
                <div id="timer" class="timer" style="margin-top: 0;"></div>
            </div>
        </header>

        <!-- Leaderboard Modal -->
        <div id="leaderboard-modal" class="modal" style="display: none;">
            <div class="modal-content" style="max-width: 400px;">
                <h2>TAT Leaderboard 🏆</h2>
                <div id="leaderboard-list" style="max-height: 300px; overflow-y: auto; margin-top: 10px;">
                    <!-- Leaderboard populated here -->
                </div>
                <button class="btn" style="margin-top: 15px; width: 100%;" onclick="closeLeaderboard()">Close</button>
            </div>
        </div>

        <div class="grid">
            <!-- Player Registration Section -->
            <section class="card">
                <h2>Register Player</h2>
                <form id="register-form">
                    <input type="text" id="player-name" placeholder="Player Name" required>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <label style="display: flex; align-items: center; gap: 5px;">
                            <input type="checkbox" id="is-computer" style="width: auto;">
                            Computer Player
                        </label>
                        <select id="computer-level" style="flex: 1;" disabled>
                            <!-- Populated by JS -->
                        </select>
                    </div>
                    <button type="submit" class="btn">Register</button>
                </form>
                <div id="players-list"></div>
            </section>

            <section class="card">
                <h2>Start Tournament</h2>
                <form id="start-form">
                    <div class="offer-form">
                        <div style="display: flex; align-items: center; gap: 10px; width: 100%;">
                            <select id="tournament-mode" style="flex: 1;">
                                <option value="legacy">Legacy (Global Timer)</option>
                                <option value="survival" selected>Survival (Last Man Standing)</option>
                            </select>
                            <div style="display: flex; align-items: center; gap: 3px;">
                                <input type="number" id="duration-hours" placeholder="Hours" min="0" max="24" value="0"
                                    style="width: 70px;">
                                <span style="font-size: 0.85em; color: var(--text-color); opacity: 0.8;">h</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 3px;">
                                <input type="number" id="duration-minutes" placeholder="Minutes" min="0" max="59" value="5"
                                    required style="width: 70px;">
                                <span style="font-size: 0.85em; color: var(--text-color); opacity: 0.8;">m</span>
                            </div>
                        </div>

                        <div style="margin-top: 10px; border: 1px solid var(--border-color); padding: 10px; border-radius: 5px;">
                            <label style="font-weight: bold; display: block; margin-bottom: 5px;">
                                <input type="checkbox" id="allow-variants" checked style="width: auto; margin-right: 5px;">
                                Allow Variants
                            </label>
                            
                            <div id="variant-selection" style="display: flex; gap: 20px; margin-top: 10px; flex-wrap: wrap;">
                                <div style="flex: 1; min-width: 200px;">
                                    <label style="font-weight: bold; display: block; margin-bottom: 5px;">Board Geometry:</label>
                                    <div style="display: flex; flex-direction: column; gap: 5px;">
                                        <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>4-Player (Cross)</span> <input type="checkbox" name="start-geometry" value="4player" checked></label>
                                        <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>3-Player Hex</span> <input type="checkbox" name="start-geometry" value="3player_hex" checked></label>
                                        <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>2-Player Hex</span> <input type="checkbox" name="start-geometry" value="2player_hex" checked></label>
                                        <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>6x6 Board</span> <input type="checkbox" name="start-geometry" value="6x6" checked></label>
                                        <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>6x6 (Same Bishops)</span> <input type="checkbox" name="start-geometry" value="6x6_same_bishop" checked></label>
                                        <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>4x4 Board</span> <input type="checkbox" name="start-geometry" value="4x4" checked></label>
                                        <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>4x4 (Pawn Center)</span> <input type="checkbox" name="start-geometry" value="4x4_pawn_center" checked></label>
                                    </div>
                                </div>

                                <div style="flex: 1; min-width: 200px;">
                                    <label style="font-weight: bold; display: block; margin-bottom: 5px;">Normal Variants:</label>
                                    <div style="display: flex; flex-direction: column; gap: 5px;">
                                        <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>Freestyle</span> <input type="checkbox" name="start-variants" value="freestyle" checked></label>
                                        <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>Kung Fu</span> <input type="checkbox" name="start-variants" value="kungfu" checked></label>
                                        <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>Crazyhouse</span> <input type="checkbox" name="start-variants" value="crazyhouse" checked></label>
                                        <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>King of the Hill</span> <input type="checkbox" name="start-variants" value="kingofthehill" checked></label>
                                        <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>Atomic</span> <input type="checkbox" name="start-variants" value="atomic" checked></label>
                                        <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>Secret Chess</span> <input type="checkbox" name="start-variants" value="secret" checked></label>
                                        <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>Fog of War</span> <input type="checkbox" name="start-variants" value="fogofwar" checked></label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-success" style="margin-top: 15px; width: 100%;">Start Tournament</button>
                </form>
                <div id="timer" class="timer"></div>
            </section>

            <!-- Leaderboard Section -->
            <section class="card leaderboard-card">
                <h2>🏆 Leaderboard</h2>
                <div id="leaderboard"></div>
            </section>

            <!-- Start Game Section -->
            <!-- Start Game Section (Disabled) -->
            <!-- Hidden dropdowns needed by app.js -->
            <select id="game-player1" style="display:none;">
                <option value="">Select Player 1 (White)</option>
            </select>
            <select id="game-player2" style="display:none;">
                <option value="">Select Player 2 (Black)</option>
            </select>
            <!-- Start Direct Game Section Removed -->

            <!-- Create Game Offer Section -->
            <section class="card">
                <h2>Create Game Offer</h2>
                <form id="create-offer-form">
                    <div class="offer-form">
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <select id="offer-time-control" required style="flex: 1;">
                                <option value="1">1 Minute</option>
                                <option value="2">2 Minutes</option>
                                <option value="3">3 Minutes</option>
                                <option value="5">5 Minutes</option>
                                <option value="10" selected>10 Minutes</option>
                                <option value="15">15 Minutes</option>
                                <option value="30">30 Minutes</option>
                                <option value="45">45 Minutes</option>
                                <option value="60">60 Minutes (G/60)</option>
                                <option value="90">90 Minutes (G/90)</option>
                                <option value="classical">Classical (120/40, 60/20, 15+30)</option>
                                <option value="uscf">USCF (90/40, 30+30)</option>
                            </select>
                            <div style="display: flex; align-items: center; gap: 3px;">
                                <input type="number" id="offer-increment" placeholder="Increment" min="0" value="0"
                                    style="width: 80px;">
                                <span style="font-size: 0.85em; color: var(--text); opacity: 0.8;">sec</span>
                            </div>
                        </div>

                        <div style="margin-top: 10px; border: 1px solid var(--border-color); padding: 10px; border-radius: 5px; display: flex; flex-wrap: wrap; gap: 20px;">
                            <div style="flex: 1; min-width: 200px;">
                                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Board Geometry:</label>
                                <div id="offer-geometry" style="display: flex; flex-direction: column; gap: 5px;">
                                    <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>Standard 8x8</span> <input type="radio" name="geometry" value="standard" checked></label>
                                    <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>4-Player (Cross)</span> <input type="radio" name="geometry" value="4player"></label>
                                    <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>3-Player Hex</span> <input type="radio" name="geometry" value="3player_hex"></label>
                                    <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>2-Player Hex</span> <input type="radio" name="geometry" value="2player_hex"></label>
                                    <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>6x6 Board</span> <input type="radio" name="geometry" value="6x6"></label>
                                    <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>4x4 Board</span> <input type="radio" name="geometry" value="4x4"></label>
                                </div>
                                <!-- Geometry specific options -->
                                <div id="geom-options-6x6" style="display:none; margin-top: 10px;">
                                    <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>Same color bishops</span> <input type="checkbox" id="offer-6x6-same-bishop"></label>
                                </div>
                                <div id="geom-options-4x4" style="display:none; margin-top: 10px;">
                                    <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>Fill center with pawns</span> <input type="checkbox" id="offer-4x4-pawn-center"></label>
                                </div>
                            </div>

                            <div style="flex: 1; min-width: 200px;">
                                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Normal Variants:</label>
                                <div id="offer-normal-variants" style="display: flex; flex-direction: column; gap: 5px;">
                                    <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>Freestyle (Chess 960)</span> <input type="checkbox" name="variants" value="freestyle"></label>
                                    <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>Kung Fu</span> <input type="checkbox" name="variants" value="kungfu"></label>
                                    <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>Crazyhouse</span> <input type="checkbox" name="variants" value="crazyhouse"></label>
                                    <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>King of the Hill</span> <input type="checkbox" name="variants" value="kingofthehill"></label>
                                    <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>Atomic</span> <input type="checkbox" name="variants" value="atomic"></label>
                                    <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>Secret Chess</span> <input type="checkbox" id="offer-secret-checkbox" name="variants" value="secret"></label>
                                    <div id="offer-secret-options" style="display: none; flex-direction: column; gap: 5px; margin-left: 10px; margin-top: 2px;">
                                        <label style="display: flex; justify-content: space-between; align-items: center;"><span style="font-size: 0.9em; color: var(--text-muted);">Secret Queens</span><select id="offer-secret-queens" style="width: 50px; padding: 2px;"><option value="0" selected>0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option></select></label>
                                        <label style="display: flex; justify-content: space-between; align-items: center;"><span style="font-size: 0.9em; color: var(--text-muted);">Secret Kings</span><select id="offer-secret-kings" style="width: 50px; padding: 2px;"><option value="0" selected>0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option></select></label>
                                        <label style="display: flex; justify-content: space-between; align-items: center;"><span style="font-size: 0.9em; color: var(--text-muted);">Queen Elizabeth Kings</span><select id="offer-secret-elizabeths" style="width: 50px; padding: 2px;"><option value="0" selected>0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option></select></label>
                                    </div>
                                    <label style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; "><span>Fog of War</span> <input type="checkbox" name="variants" value="fogofwar"></label>
                                </div>
                            </div>
                        </div>

                        <div style="margin-top: 10px; display: flex; gap: 10px;">
                            <input type="text" id="offer-start-pos" placeholder="Pos ID (0-959) or Random"
                                style="display:none; width: auto;">
                            <input type="number" id="offer-cooldown" placeholder="Cooldown (sec)" min="1" max="60"
                                value="10" style="display:none; width: 120px;">
                        </div>
                    </div>
                    <div style="margin-top: 10px;">
                        <label for="offer-targets" style="display: block; margin-bottom: 5px;">Target Players (Hold
                            Cmd/Ctrl to select multiple):</label>
                        <select id="offer-targets" multiple style="width: 100%; height: 100px;">
                            <option value="Any" selected>Any / Open to All</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Post Offer</button>
                </form>
            </section>

            <!-- Open Offers Section -->
            <section class="card">
                <h2>📢 Open Offers</h2>
                <div id="open-offers"></div>
            </section>

            <!-- Games in Progress Section -->
            <section class="card">
                <h2>♟️ Games in Progress</h2>
                <div id="active-games"></div>
            </section>
        </div>

        <div id="message" class="message"></div>
    </div>

    <!-- Tournament End Celebration Modal -->
    <div id="celebration-modal" class="celebration-modal">
        <div class="celebration-content">
            <h2 class="celebration-title">🎉 Tournament Complete! 🎉</h2>
            <div id="celebration-results" class="celebration-results">
                <!-- Dynamically populated by JS -->
            </div>
            <button id="celebration-close" class="celebration-close">Continue</button>
        </div>
    </div>
    <div id="confetti-container" class="confetti-container"></div>

    <script src="ui.js"></script>
    <script src="hexRenderer.js"></script>
    <script src="canvasRenderer.js"></script>
    <script src="app.js"></script>
    <script>
        function toggleReportMenu(e) {
            if (e) e.stopPropagation();
            document.getElementById('report-menu').classList.toggle('show');
            var am = document.getElementById('account-menu');
            if (am) am.classList.remove('show');
        }
        function toggleAccountMenu(e) {
            if (e) e.stopPropagation();
            document.getElementById('account-menu').classList.toggle('show');
            var rm = document.getElementById('report-menu');
            if (rm) rm.classList.remove('show');
        }

        async function submitIssue() {
            const issueText = document.getElementById('issue-text').value;
            if (!issueText) return alert('Please enter an issue description.');
            
            const submitBtn = document.querySelector('#report-menu .btn-success');
            const originalText = submitBtn.innerText;
            submitBtn.innerText = 'Sending...';
            submitBtn.disabled = true;

            try {
                const url = (typeof API_URL !== 'undefined' ? API_URL : '') + '/api/report-issue';
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ issue: issueText })
                });
                if (res.ok) {
                    alert('Issue reported successfully!');
                    document.getElementById('issue-text').value = '';
                    document.getElementById('report-menu').classList.remove('show');
                } else {
                    alert('Failed to report issue. Please try again.');
                }
            } catch(e) {
                alert('Error sending issue.');
            } finally {
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
            }
        }

        window.onclick = function(event) {
            if (!event.target.closest('.report-dropdown')) {
                var reportMenu = document.getElementById('report-menu');
                if (reportMenu && reportMenu.classList.contains('show')) {
                    reportMenu.classList.remove('show');
                }
            }
            if (!event.target.closest('.account-dropdown')) {
                var accountMenu = document.getElementById('account-menu');
                if (accountMenu && accountMenu.classList.contains('show')) {
                    accountMenu.classList.remove('show');
                }
            }
        }
    </script>
</body>

</html>
